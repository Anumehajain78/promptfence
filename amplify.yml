version: 1
# Monorepo: the Next.js app lives in frontend/. Commands use --prefix so they
# work from the repo root regardless of whether `cd` persists between commands.
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --prefix frontend
    build:
      commands:
        - npm run build --prefix frontend
  artifacts:
    baseDirectory: frontend/out
    files:
      - "**/*"
  cache:
    paths:
      - frontend/node_modules/**/*
